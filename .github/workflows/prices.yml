name: Oppdater priser daglig

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml playwright
      - run: playwright install chromium --with-deps
      - run: python scraper/update_prices.py
