<!DOCTYPE html>
<html lang="nb" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ønsker">
  <meta name="theme-color" content="#B0613F">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>Ønsker</title>
</head>
<body>

<!-- ── Offline banner ── -->
<div id="offline-banner" style="display:none;background:#A24A3A;color:#fff;text-align:center;padding:8px 12px;font-size:13px;position:sticky;top:0;z-index:100;">
  Offline — viser lagret versjon. Endringer lagres ikke. <button onclick="refreshData()" style="background:rgba(255,255,255,0.2);border:none;color:#fff;padding:2px 10px;border-radius:6px;cursor:pointer;margin-left:8px;">Prøv igjen</button>
</div>

<!-- ── Header ── -->
<div class="header">
  <div class="header-top">
    <h1>Ønsker</h1>
    <div class="header-actions">
      <button class="currency-pill" id="currency-pill" onclick="cycleCurrency()">kr ▾</button>
      <button class="theme-pill" id="theme-pill" onclick="cycleTheme()" title="Bytt tema">🎨</button>
      <button class="theme-pill" id="bubble-pill" onclick="openBubbles()" title="Grupper etter kategori">🫧</button>
      <button class="btn-icon" onclick="openAdd()" title="Ny vare">+</button>
    </div>
  </div>
  <div class="totals-bar" id="totals-bar"></div>
</div>

<!-- ── Add bar (lim inn lenke) ── -->
<div class="add-bar">
  <input id="add-input" class="add-input" type="text" placeholder="Lim inn lenke…"
         autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <button class="btn-paste" onclick="pasteFromClipboard()" title="Lim inn">📋</button>
  <button class="btn-add" id="btn-add" onclick="handleAdd()">Legg til</button>
</div>
<div class="add-extra">
  <input id="add-name" class="add-extra-input" type="text" placeholder="Navn (valgfritt)">
  <input id="add-price" class="add-extra-input add-price-input" type="number" placeholder="Pris" min="0">
  <select id="add-currency" class="add-cur-select">
    <option value="NOK">kr</option>
    <option value="EUR">EUR</option>
    <option value="USD">USD</option>
    <option value="GBP">GBP</option>
    <option value="SEK">SEK</option>
    <option value="DKK">DKK</option>
  </select>
</div>

<!-- ── Pending queue ── -->
<div id="pending-bar"></div>

<!-- ── Search / sort / filters ── -->
<div id="filter-bar"></div>

<!-- ── Main content ── -->
<div id="main"></div>

<!-- ── Boble-oversikt (klyp for å zoome ut) ── -->
<div class="bubble-view" id="bubble-view"></div>

<!-- ── Product detail sheet ── -->
<div class="modal-overlay" id="detail-overlay" onclick="if(event.target===this)closeDetail()">
  <div class="modal detail-modal">
    <div class="sheet-handle"></div>
    <div class="detail-img-wrap" id="detail-img-wrap"></div>
    <div class="detail-body">
      <div class="detail-name" id="detail-name"></div>
      <div class="detail-price" id="detail-price"></div>
      <div class="detail-cats" id="detail-cats"></div>
      <div class="detail-notes" id="detail-notes"></div>
      <div class="detail-section-label">Status</div>
      <div class="detail-status-row" id="detail-status-row"></div>
      <div class="detail-footer">
        <a class="detail-url-btn" id="detail-url-btn" href="" target="_blank" rel="noopener">Åpne nettbutikk ↗</a>
        <div class="detail-actions">
          <button class="btn-danger-outline" onclick="deleteFromDetail()">Slett</button>
          <button class="btn-primary" onclick="openEditFromDetail()">Rediger</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Add / Edit sheet ── -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="sheet-handle"></div>
    <h3 id="edit-title">Ny vare</h3>

    <div class="modal-row" id="link-field-row">
      <label>Lenke</label>
      <div class="link-row">
        <input type="url" id="edit-url" placeholder="https://..." style="flex:1">
        <button type="button" class="btn-paste" onclick="pasteIntoEditUrl()" title="Lim inn">📋</button>
        <a id="edit-open-link" class="link-open-btn" href="" target="_blank" rel="noopener" style="display:none">↗</a>
      </div>
    </div>

    <div class="modal-row">
      <label>Navn</label>
      <input type="text" id="edit-name" placeholder="Produktnavn">
    </div>

    <div class="modal-row">
      <label>Kategorier</label>
      <div class="cat-checkboxes" id="cat-checkboxes"></div>
    </div>

    <div class="modal-row">
      <label>Måned</label>
      <select id="edit-month">
        <option value="">— Ingen —</option>
        <option>Jan</option><option>Feb</option><option>Mar</option>
        <option>Apr</option><option>Mai</option><option>Jun</option>
        <option>Jul</option><option>Aug</option><option>Sep</option>
        <option>Okt</option><option>Nov</option><option>Des</option>
      </select>
    </div>

    <div class="modal-row">
      <label>Pris</label>
      <div class="currency-select-row">
        <input type="number" id="edit-price" placeholder="0" min="0" oninput="updateCurrencyPreview()" style="flex:1">
        <select id="edit-currency" onchange="updateCurrencyPreview()">
          <option value="NOK">🇳🇴 kr</option>
          <option value="EUR">🇪🇺 EUR</option>
          <option value="USD">🇺🇸 USD</option>
          <option value="GBP">🇬🇧 GBP</option>
          <option value="SEK">🇸🇪 SEK</option>
          <option value="DKK">🇩🇰 DKK</option>
        </select>
      </div>
      <div id="currency-preview"></div>
    </div>

    <div class="modal-row">
      <label>Status</label>
      <div class="status-checkboxes" id="status-checkboxes"></div>
    </div>

    <div class="modal-row">
      <label>Notater</label>
      <input type="text" id="edit-notes" placeholder="Valgfritt …">
    </div>

    <div class="modal-row">
      <label>Bilde-URL</label>
      <div class="image-url-row">
        <input type="url" id="edit-image" placeholder="https://..." style="flex:1">
        <img id="edit-image-preview" src="" alt="">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-danger-outline" id="btn-delete" onclick="deleteFromEdit()" style="display:none">Slett</button>
      <button class="btn-primary" onclick="saveEdit()">Lagre</button>
    </div>
  </div>
</div>

<!-- ── Savings sheet ── -->
<div class="modal-overlay" id="spar-overlay" onclick="if(event.target===this)closeSpar()">
  <div class="modal">
    <div class="sheet-handle"></div>
    <div class="spar-eyebrow">Legg til sparing</div>
    <h3 id="spar-title"></h3>
    <div class="spar-sub" id="spar-sub"></div>
    <div class="spar-quick">
      <button type="button" onclick="sparQuick(100)">+100</button>
      <button type="button" onclick="sparQuick(250)">+250</button>
      <button type="button" onclick="sparQuick(500)">+500</button>
    </div>
    <div class="modal-row">
      <label>Eget beløp</label>
      <input type="number" id="spar-input" placeholder="0" min="0">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeSpar()">Avbryt</button>
      <button class="btn-primary" id="spar-confirm" onclick="sparConfirm()">Legg til</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<!-- ── Bottom nav ── -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-wishlist" onclick="setView('wishlist')">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364
               L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
    </svg>
    Ønsker
  </button>
  <button class="nav-btn" id="nav-months" onclick="setView('months')">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
    </svg>
    Måneder
  </button>
  <button class="nav-btn" id="nav-archive" onclick="setView('archive')">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8
               m-9 4h4"/>
    </svg>
    Arkiv
  </button>
</nav>

<script src="./app.js"></script>
</body>
</html>
